---
- hosts: all
  gather_facts: yes
  vars:
    service_name: dns-filter
    service_user: dnsfilter
    service_group: dnsfilter
    binary_name: dns_filter
    target_bin: "/usr/local/bin/{{ binary_name }}"
    target_config: /etc/dnsfilter.yml
    target_service_file: "/etc/systemd/system/{{ service_name }}.service"
    target_resolv_conf: /etc/resolv.conf
    local_binary_path: "{{ playbook_dir }}/service/{{ binary_name }}_linux"
    local_config_path: "{{ playbook_dir }}/config.yml"
    wg_required: "auto"
    use_local_dns: "yes"
    deployment_probe_retries: 6
    deployment_probe_delay: 2
    deployment_all_components: [bootstrap, system, setup, binary, config, firewall, dns]
    deployment_components: >-
      {{ deployment_all_components
         | intersect(deployment_all_components if 'all' in ansible_run_tags else ansible_run_tags)
         | difference(ansible_skip_tags) }}

  tasks:
    - name: Determine WireGuard setting
      set_fact:
        wg_enabled: "{{ ('wg0' in ansible_facts['interfaces']) if wg_required == 'auto' else (wg_required | bool) }}"
      tags: [always]

    - name: Build the Linux binary before changing the remote host
      delegate_to: localhost
      command:
        argv: [go, build, -o, "{{ local_binary_path }}", ./service]
        chdir: "{{ playbook_dir }}"
      environment:
        GOOS: linux
        CGO_ENABLED: "0"
        GOARCH: amd64
      tags: [binary]

    - name: Validate and deploy with rollback
      import_tasks: tasks/deploy.yml
      when: deployment_components | length > 0
      tags: [always]

    - name: Remove local build artifact
      delegate_to: localhost
      file:
        path: "{{ local_binary_path }}"
        state: absent
      tags: [binary]
